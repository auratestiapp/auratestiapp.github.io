.avatar span{display:flex;width:100%;height:100%;border-radius:50%;background:#fff;align-items:center;justify-content:center;

.alan{width:100%;height:54px;border:1.4px solid var(--cizgi);border-radius:18px;background:#fff;text-align:center;

<script>
(function () {
  'use strict';
  // Supabase: yalnız herkese açık (publishable) anahtar; web fonksiyonları giriş istemez
  var API = 'https://sntailjwlbkiubgjtfoa.supabase.co/rest/v1/rpc/';
  var ANAHTAR = 'sb_publishable_tbb-jlvB9dJMpce74OXETA_y_fYeOLU';
  var PAKET = 'com.auratesti.aura_testi';

  var q = new URLSearchParams(location.search);
  var ham = (q.get('k') || q.get('kod') || '').trim().toUpperCase();
  var KOD = /^[A-Z0-9]{4,10}$/.test(ham) ? ham : null;
  var KAYNAK = (q.get('s') || 'tahmin').replace(/[^a-z_]/gi, '').slice(0, 20) || 'tahmin';
  var ua = navigator.userAgent || '';
  var ANDROID = /Android/i.test(ua);
  var IOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var govde = document.getElementById('govde');
  var durum = { sahip: '', sorular: [], i: 0, tahmin: {}, secilen: null, ad: '' };

  // ── yardımcılar ──
  function el(etiket, ozellik) {
    var e = document.createElement(etiket);
    if (ozellik) for (var k in ozellik) {
      if (k === 'metin') e.textContent = ozellik[k];
      else if (k === 'sinif') e.className = ozellik[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), ozellik[k]);
      else e.setAttribute(k, ozellik[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return e;
  }
  function goster() {
    govde.textContent = '';
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) govde.appendChild(arguments[i]);
    window.scrollTo(0, 0);
  }
  function rpc(ad, veri) {
    return fetch(API + ad, {
      method: 'POST',
      headers: { 'apikey': ANAHTAR, 'Content-Type': 'application/json' },
      body: JSON.stringify(veri)
    }).then(function (r) {
      if (!r.ok) throw new Error('sunucu ' + r.status);
      return r.json();
    });
  }
  function sakla(anahtar, deger) { try { localStorage.setItem(anahtar, JSON.stringify(deger)); } catch (e) {} }
  function oku(anahtar) { try { return JSON.parse(localStorage.getItem(anahtar) || 'null'); } catch (e) { return null; } }
  function unvanSimgesi(u) { return u === 'Ruh ikizi' ? '🔮' : u === 'Yakın dost' ? '💞' : u === 'İyi arkadaş' ? '🤝' : '🌱'; }
  function sahipAdi() { return durum.sahip || 'Arkadaşın'; }
  function basHarf(ad) { var h = (ad || '').trim().charAt(0); return h ? h.toLocaleUpperCase('tr-TR') : '✦'; }

  // Play bağlantısı: kod ve (varsa) web sonucunun anahtarı uygulamaya taşınır
  function playLinki(token) {
    var r = 'utm_source=aura_web&utm_medium=' + KAYNAK + (KOD ? '&kod=' + KOD : '') + (token ? '&ws=' + token : '');
    return 'https://play.google.com/store/apps/details?id=' + PAKET + '&referrer=' + encodeURIComponent(r);
  }
  // Uygulama yüklüyse içinde açar (Instagram gibi uygulama içi tarayıcılar için); yoksa Play'e gider
  function uygulamadaAcLinki() {
    return 'intent://auratestiapp.github.io/oyna/?k=' + KOD + '#Intent;scheme=https;package=' + PAKET +
      ';S.browser_fallback_url=' + encodeURIComponent(playLinki(null)) + ';end';
  }
  function indirKutusu(baslik, metin, token) {
    var kutu = el('div', { sinif: 'davet' },
      el('h2', { metin: baslik }),
      el('p', { sinif: 'alt', metin: metin }),
      el('div', { sinif: 'bosluk' }));
    if (IOS) {
      kutu.appendChild(el('p', { sinif: 'alt', metin: 'Aura şimdilik Android\'de; iPhone sürümü çok yakında 💜' }));
    } else {
      kutu.appendChild(el('a', { sinif: 'dugme', href: playLinki(token), rel: 'noopener' }, 'Aura\'yı indir · Google Play'));
    }
    return kutu;
  }
  function altNot() {
    return el('p', { sinif: 'kucuk alt-not' },
      'Yazdığın ad ve tahminlerin yalnız oyunun sahibine gösterilir; 90 gün sonra silinir. ',
      el('a', { href: '../gizlilik.html', metin: 'Gizlilik' }));
  }

  // ── ekranlar ──
  function hataEkrani(baslik, metin, indir) {
    goster(el('div', { sinif: 'orta' },
      el('div', { sinif: 'serif', style: 'font-size:54px', metin: '🔍' }),
      el('div', { sinif: 'bosluk' }),
      el('h2', { metin: baslik }),
      el('div', { sinif: 'bosluk' }),
      el('p', { sinif: 'alt', metin: metin }),
      indir ? indirKutusu('Auranı keşfet ✨', 'Kişiliğini 50 karakterle keşfet, her gün kartını çek, arkadaşlarınla eğlen.', null) : null));
  }

  function davetEkrani() {
    // Oyun henüz hazır değil: doğrudan Aura'ya davet
    goster(el('div', { sinif: 'orta' },
      el('div', { sinif: 'avatar' }, el('span', { metin: basHarf(durum.sahip) })),
      el('h1', { metin: sahipAdi() + ' seni Aura\'ya davet etti 💜' }),
      el('div', { sinif: 'bosluk' }),
      el('p', { sinif: 'alt', metin: 'Tahmin oyunu henüz hazır değil. Aura\'yı indir, ilk kartını çek; auralarınızın ne kadar uyumlu olduğunu birlikte görün.' }),
      indirKutusu('Auranı keşfet ✨', 'Bu düğmeyle indirip kayıt olunca ' + sahipAdi() + ' ile arkadaş olursunuz.', null)));
  }

  function girisEkrani() {
    var alan = el('input', { sinif: 'alan', type: 'text', maxlength: '24', placeholder: 'Adın', autocomplete: 'given-name', enterkeyhint: 'go' });
    function basla() {
      durum.ad = alan.value.trim();
      durum.i = 0; durum.tahmin = {}; durum.secilen = null;
      soruEkrani();
    }
    alan.addEventListener('keydown', function (e) { if (e.key === 'Enter') basla(); });
    goster(el('div', { sinif: 'orta' },
      el('div', { sinif: 'avatar' }, el('span', { metin: basHarf(durum.sahip) })),
      el('h1', { metin: sahipAdi() + ' seni tahmin etmeye çağırıyor' }),
      el('div', { sinif: 'bosluk' }),
      el('p', { sinif: 'alt', metin: 'Onu ne kadar tanıyorsun? 10 soru, 1 dakika. Kurulum yok; burada oynanır.' }),
      el('div', { sinif: 'bosluk2' }),
      alan,
      el('p', { sinif: 'kucuk', style: 'margin-top:6px', metin: 'Sonucu ' + sahipAdi() + ' bu adla görecek.' }),
      el('div', { sinif: 'bosluk' }),
      el('button', { sinif: 'dugme', type: 'button', onclick: basla }, 'Başla'),
      ANDROID ? el('a', { sinif: 'yazi-dugme', href: uygulamadaAcLinki() }, 'Aura yüklü mü? Uygulamada aç') : null),
      altNot());
  }

  function soruEkrani() {
    var s = durum.sorular[durum.i];
    var noktalar = el('div', { sinif: 'noktalar' });
    for (var n = 0; n < durum.sorular.length; n++) {
      noktalar.appendChild(el('i', { sinif: (n < durum.i || (n === durum.i && durum.secilen != null)) ? 'dolu' : '' }));
    }
    var siklar = el('div');
    (s.siklar || []).forEach(function (k) {
      var secili = durum.secilen === k.id;
      var soluk = durum.secilen != null && !secili;
      siklar.appendChild(el('button', {
        sinif: 'sik' + (secili ? ' secili' : '') + (soluk ? ' soluk' : ''), type: 'button',
        onclick: function () { sec(s.id, k.id); }
      }, k.sik_metni || ''));
    });
    goster(
      el('h2', { style: 'text-align:center;margin-top:8px', metin: sahipAdi() + ' ne derdi?' }),
      noktalar,
      el('div', { sinif: 'soru' },
        el('div', { sinif: 'soru-metni', metin: s.soru_metni || '' }),
        siklar));
  }

  function sec(soruId, sikId) {
    if (durum.secilen != null) return;
    durum.secilen = sikId;
    durum.tahmin[soruId] = sikId;
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
    soruEkrani();
    setTimeout(function () {
      if (durum.i + 1 >= durum.sorular.length) { bitir(); return; }
      durum.i++; durum.secilen = null;
      soruEkrani();
    }, 420);
  }

  function bitir() {
    goster(el('div', { sinif: 'orta' }, el('div', { sinif: 'yukleniyor' }),
      el('p', { sinif: 'alt', metin: 'Tahminlerin karşılaştırılıyor…' })));
    var tahminler = Object.keys(durum.tahmin).map(function (k) { return { soru: Number(k), sik: durum.tahmin[k] }; });
    rpc('tahmin_oyunu_web_bitir', { p_kod: KOD, p_tahminler: tahminler, p_ad: durum.ad || null })
      .then(function (r) {
        if (!r || r.hata) throw new Error(r && r.hata);
        r.sahip_ad = r.sahip_ad || durum.sahip;
        sakla('aura_oyna_' + KOD, r);
        sonucEkrani(r, true);
      })
      .catch(function () {
        goster(el('div', { sinif: 'orta' },
          el('h2', { metin: 'Sonuç gönderilemedi' }),
          el('div', { sinif: 'bosluk' }),
          el('p', { sinif: 'alt', metin: 'İnternet bağlantını kontrol edip tekrar dene.' }),
          el('div', { sinif: 'bosluk2' }),
          el('button', { sinif: 'dugme', type: 'button', onclick: bitir }, 'Tekrar dene')));
      });
  }

  function sonucEkrani(r, yeni) {
    var sahip = r.sahip_ad || sahipAdi();
    var skor = Number(r.skor) || 0, toplam = Number(r.toplam) || 10;
    var skorYazi = el('div', { sinif: 'skor', metin: (yeni ? 0 : skor) + '/' + toplam });
    var kart = el('div', { sinif: 'sonuc' },
      el('div', { sinif: 'etiket', metin: 'AURA · TAHMİN OYUNU' }),
      el('div', { sinif: 'kim', metin: sahip + ' için tahminlerin' }),
      skorYazi,
      el('div', { sinif: 'unvan', metin: unvanSimgesi(r.unvan) + ' ' + (r.unvan || '') }));
    var farklar = Array.isArray(r.farklar) ? r.farklar : [];
    if (farklar.length) {
      var kutu = el('div', { style: 'margin-top:16px' });
      farklar.forEach(function (f) {
        kutu.appendChild(el('div', { sinif: 'fark' }, 'Onu ',
          el('b', { sinif: 'p', metin: f.sanilan_ad || '' }), ' sandın; aslında ',
          el('b', { sinif: 'm', metin: f.gercek_ad || '' }), ' yanı ağır basıyor.'));
      });
      kart.appendChild(kutu);
    } else if (r.gizli) {
      kart.appendChild(el('p', { style: 'margin-top:14px;font-size:13.5px', metin: 'Karakter sonuçları gizli tutuluyor.' }));
    }
    var paylas = null;
    if (navigator.share) {
      paylas = el('button', { sinif: 'ikinci', type: 'button', style: 'margin-top:12px', onclick: function () {
        navigator.share({
          text: sahip + ' için ' + skor + '/' + toplam + ' bildim: ' + (r.unvan || '') + ' ' + unvanSimgesi(r.unvan) +
            '\nSen de dene, onu ne kadar tanıyorsun?',
          url: location.origin + location.pathname + '?k=' + KOD
        }).catch(function () {});
      } }, 'Sonucu paylaş');
    }
    goster(el('div', { style: 'padding-top:10px' },
      kart,
      paylas,
      indirKutusu('Şimdi sıra sende ✨',
        'Kendi auranı keşfet, arkadaşların seni tahmin etsin. Aura\'yı bu düğmeyle indirip kayıt olursan sonucun hesabına kaydedilir ve ' +
        sahip + ' ile arkadaş olursunuz.', r.token || null)),
      altNot());
    if (yeni) {
      // Skor sayarak yükselir
      var t0 = null;
      var adim = function (t) {
        if (t0 == null) t0 = t;
        var o = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - o, 3);
        skorYazi.textContent = Math.round(skor * e) + '/' + toplam;
        if (o < 1) requestAnimationFrame(adim);
      };
      requestAnimationFrame(adim);
    }
  }

  // ── başlangıç ──
  if (!KOD) {
    hataEkrani('Link eksik görünüyor', 'Arkadaşının gönderdiği linkin tamamını açtığından emin ol.', true);
    return;
  }
  var eski = oku('aura_oyna_' + KOD);
  if (eski && typeof eski.skor === 'number') {
    durum.sahip = eski.sahip_ad || '';
    sonucEkrani(eski, false);
    return;
  }
  rpc('tahmin_oyunu_web', { p_kod: KOD })
    .then(function (r) {
      durum.sahip = (r && r.sahip_ad) || '';
      if (!r || r.hata === 'kod_yok') {
        hataEkrani('Bu linkle bir oyun bulamadık', 'Arkadaşından linki yeniden göndermesini isteyebilirsin.', true);
      } else if (r.hata === 'oyun_yok') {
        davetEkrani();
      } else if (!Array.isArray(r.sorular) || !r.sorular.length) {
        hataEkrani('Bu oyunda soru bulunamadı', 'Birkaç gün sonra tekrar dene.', true);
      } else {
        durum.sorular = r.sorular;
        girisEkrani();
      }
    })
    .catch(function () {
      hataEkrani('Oyun açılamadı', 'İnternet bağlantını kontrol edip sayfayı yenile.', false);
    });
})();
</script>
</body>
</html>
